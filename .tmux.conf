################################################################################
## PREFIX
################################################################################
# macOS: Ctrl-a (easier to reach), Linux: Ctrl-b (default, avoids conflict with
# readline's Ctrl-a go-to-beginning-of-line which is more useful without macOS
# keybindings remapping it)
if-shell "uname | grep -q Darwin" \
    "set -g prefix C-a" \
    "set -g prefix C-b"

################################################################################
## KEY BINDINGS
################################################################################
# Pass Ctrl-L (clear screen) and Ctrl-K (kill line) through to the shell,
# since the prefix key (C-a) would otherwise swallow them
bind C-l send-keys 'C-l'
bind C-k send-keys 'C-k'

# Escape enters copy-mode (like vim normal mode)
bind Escape copy-mode

# Use v to start visual selection in copy-mode (like vim)
bind -T copy-mode-vi 'v' send -X begin-selection

################################################################################
## WINDOW / PANE BEHAVIOR
################################################################################
# Prevent programs from renaming windows (keep manual names)
set -g allow-rename off
# Don't highlight windows with background activity
set -g monitor-activity off
# Vi-style keys in copy mode and pane navigation
set -g mode-keys vi
# Enable mouse for pane selection, resizing, and scrollback
set -g mouse on

################################################################################
## STATUS BAR
################################################################################
set -g status on
# Refresh status bar every 5 seconds
set -g status-interval 5
# Center the window list
set -g status-justify centre

# Left side: hostname, then session name in a colored block
# The block turns green when the prefix key is active
set -g status-left-length 60
set -g status-left '#H #[bg=colour4]#[fg=colour0]#{?client_prefix,#[bg=colour2],} ❐ #S #[bg=colour0]#[fg=colour7]#{?client_prefix,#[fg=colour2],} '

# Right side: clock, plus rainbarf system stats if available
set -g status-right-length 120
if-shell "command -v rainbarf >/dev/null" \
    "set -g status-right '%H:%M:%S #(rainbarf --nobattery --rgb)'" \
    "set -g status-right '%H:%M:%S'"

################################################################################
## APPEARANCE (SOLARIZED DARK)
################################################################################
# Status bar: yellow text on black background
set -g status-style bg=black,fg=yellow
# Inactive windows in green, active window in bright red
set -g window-status-style fg=green
set -g window-status-current-style fg=brightred
# Format active window as |index:name| to make it stand out
set -g window-status-current-format "|#I:#W|"

# Pane borders: subtle black for inactive, yellow for active (matches status bar)
set -g pane-border-style fg=black
set -g pane-active-border-style fg=yellow

# Command-line / message bar
set -g message-style bg=black,fg=brightred

# Colors shown when using display-panes (prefix + q)
set -g display-panes-active-colour yellow
set -g display-panes-colour brightred

################################################################################
## PLUGINS
################################################################################
set -g @plugin 'tmux-plugins/tpm'             # plugin manager
set -g @plugin 'tmux-plugins/tmux-sensible'    # sensible defaults
set -g @plugin 'sainnhe/tmux-fzf'              # fuzzy finder integration
set -g @plugin 'christoomey/vim-tmux-navigator' # seamless vim/tmux pane navigation
set -g @plugin 'tya/tmux-pain-control'         # intuitive pane split/resize bindings
set -g @plugin 'tmux-plugins/tmux-open'        # open highlighted file/url from copy mode
set -g @plugin 'tmux-plugins/tmux-yank'        # system clipboard copy in copy mode
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions across restarts
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save/restore via resurrect
set -g @plugin 'tmux-plugins/tmux-sessionist'  # session switching and creation helpers

# Resurrect: restore vim/nvim sessions but not other processes
set -g @resurrect-processes 'false'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Continuum: auto-start tmux on boot and restore last saved session
set -g @continuum-boot 'on'
if-shell "uname | grep -q Darwin" \
    "set -g @continuum-boot-options 'iterm'"
set -g @continuum-restore 'on'

# Auto install TPM if not present
if "test ! -d ~/.tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/tpm'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
